name: Task
description: A single unit of work (finishable in 1–3 days)
title: "[Task] "
labels: ["type:task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What does "done" look like?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: input
    id: epic
    attributes:
      label: Parent epic
      description: Link the epic issue, e.g. #12
  - type: dropdown
    id: size
    attributes:
      label: Size
      options:
        - S (< 1 day)
        - M (1–3 days)
        - L (> 3 days, consider splitting)
  - type: textarea
    id: notes
    attributes:
      label: Notes / links
